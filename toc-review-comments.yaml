# =============================================================================
# T09 목차 검토 의견 양식 (toc-review-comments.yaml)
# -----------------------------------------------------------------------------
# 쓰는 곳 (확정 워크플로우 v3)
#   7번  목차 승인 (사람)               → 출력. 6번 목차 생성의 수정 모드 입력
#   16번 검증 결과 확인 (사람)          → 목차 변경 의견. 6번 수정 모드 입력
#        경로: 16 → 6 (수정 모드) → 7 재승인 → 8 제목 동기화만 → 11 재검증
#        최대 2회. 수정–재검증 반복 3회와 따로 센다. 2회를 넘으면 16번에서
#        직접 수정하거나 예외 승인(T34)을 받는다 (사용자 결정 2026-11-04)
# 형식   YAML 1.2
# 검증   workflow-core/schemas/toc-review-comments.schema.json (JSON Schema 2020-12)
# 판     schema_version 1 (2026-11-04). 2026-10-22 v2 6번 양식을 v3 7·16번에 맞춰 다시 작성
# =============================================================================
#
# 작성 규칙
#  1. 대상은 토픽 id(파일 이름에서 .dita를 뺀 것)로 적는다. 예: t_install-anchor
#     제목·쪽 번호는 고치는 중에 바뀌므로 대상 지정에 쓰지 않는다.
#  2. 동작(action)은 아래 7개만 쓴다. 의견 하나에 변경 하나.
#       rename  제목 변경        add     토픽 추가       delete  토픽 삭제
#       move    위치 이동        retype  토픽 유형 변경   answer  질문에 답
#       note    기록만 (맵을 바꾸지 않음)
#  3. 무엇을 바꿀지(new_title 등)와 왜 바꾸는지(reason)를 따로 적는다.
#     6번 에이전트는 reason을 근거로 변경을 덧붙이지 않고, 적힌 항목만 반영한다.
#  4. base_revision에는 검토한 ditamap의 sha256 앞 12자리를 적는다.
#     다른 판의 맵에 의견이 잘못 적용되는 것을 막는다.
#       Windows PowerShell : (Get-FileHash .\installation_manual.ditamap -Algorithm SHA256).Hash.Substring(0,12).ToLower()
#       Linux/macOS        : sha256sum installation_manual.ditamap | cut -c1-12
#  5. 다음 값은 반드시 따옴표로 감싼다. 감싸지 않으면 YAML이 다른 값으로 읽는다.
#       콜론+공백(': ')이 들어간 값
#                         예: '기초 [TBD: 출처 필요] 확인'  (따옴표가 없으면 YAML 구문 오류)
#                         예: '[TBD: 출처 필요]'            (따옴표가 없으면 목록 [{TBD: 출처 필요}])
#       대괄호로 시작하는 값 예: '[user1]'           (따옴표가 없으면 목록 ['user1'])
#       날짜              예: '2026-11-04'          (따옴표가 없으면 날짜 형식으로 변환)
#  6. 제품 고유 정보(수치, 절차, UI 이름, 안전 메시지)는 이 양식에 쓰지 않는다.
#     목차 구조와 제목만 다룬다.
#
# origin별 제한
#  step7  : decision 3가지 모두 사용. toc_return_count는 비운다(null).
#  step16 : decision은 changes_requested만. toc_return_count에 이번이 몇 번째 복귀인지
#           1 또는 2를 적는다. 동작은 rename, note만 쓴다 (기본값 — 8번이 제목 동기화만
#           실행하므로 토픽 파일이 새로 생기거나 없어지는 변경은 이 경로로 처리하지 않는다).
#
# decision 값
#  approved           승인. comments에는 answer, note만 둘 수 있다 → 8번
#  changes_requested  수정 요청. 6번 수정 모드가 comments만 반영 → 7번 재승인
#  rejected           반려. 6번 생성 모드로 목차를 다시 만든다 (기본값) → 7번
# =============================================================================

schema_version: '1'

review:
  origin: step7                 # step7 | step16
  map_file: ''                  # 예: installation_manual.ditamap
  base_revision: ''             # 예: 1f6949fe4bbf (sha256 앞 12자리, 소문자)
  reviewer: ''                  # 예: '[user1]'
  reviewed_on: ''               # 예: '2026-11-04'
  decision: changes_requested   # approved | changes_requested | rejected
  toc_return_count: null        # origin: step16일 때만 1 또는 2
  related_findings: []          # (선택) 근거 리포트 항목. 예: 'report-13-i1.json#f0003'

comments: []

