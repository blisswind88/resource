    task: 10번 용어 검사 리포트(1회차)와 11~15 리포트를 한 번에 검토. 기술적 정확성 판단, 수정 항목과 수정 내용 결정, 허용할 경고 지정, 필요 시 용어집 갱신. 수정 항목이 없으면 현재 검증 대상 토픽을 최종 토픽으로 확정. 반복 상한(3회) 도달 시 직접 수정 또는 예외 승인을 결정
    inputs:
      - diff (변경 전후 비교)
      - 규칙 검증 리포트
      - 내용 검증 리포트
      - 링크 리포트
      - 빌드 로그 리포트
      - 용어 검사 리포트
      - 유효성 리포트
      - 정형성 리포트
    outputs:
      - 갱신된 용어집 (필요 시)
      - 수정 지시서 (항목별 수정 내용)
      - 예외 승인 기록 (잔여 오류·허용 사유)
      - 최종 토픽
    sends_to_external_llm: false
    included: true
    requires_exclusion_reason: true
    exclusion_reason:
  - number: 17
    id: step17
    label: 오류 사항 수정 및 반영
    type: CorrectionStep
    performed_by:
      - kind: llm
        name: 오류 사항 수정 및 반영 (LLM)
      - kind: script
        name: 오류 사항 수정 및 반영 (스크립트)
    task: 기계적 수정(XML 오류, 용어 치환)은 자동 처리. 내용 수정은 16번 지시서에 적힌 내용만 반영. 용어 치환은 최신 용어집 기준. 변경 전후 비교(diff) 생성
    inputs:
      - 수정 지시서 (항목별 수정 내용)
      - 최신 용어집
      - 토픽 (검증·수정 대상)
    outputs:
      - diff (변경 전후 비교)
      - 수정된 토픽
    sends_to_external_llm: true
    included: true
    requires_exclusion_reason: false
    exclusion_reason:
    external_transmissions:
      - data: 수정 지시서 (항목별 수정 내용)
        condition: 항상
      - data: 토픽 (검증·수정 대상)
        condition: 항상
    constraints:
      - 내용 수정은 16번 지시서에 적힌 내용만 반영
  - number: 18
    id: step18
    label: PDF/HTML 변환
    type: PublishingStep
    performed_by:
      - kind: script
        name: PDF/HTML 변환 (DITA-OT)
    task: DITA-OT로 최종 출력물 생성
    inputs:
      - 승인된 DITA map
      - 최종 토픽
    outputs:
      - HTML
      - PDF
    sends_to_external_llm: false
    included: true
    requires_exclusion_reason: false
    exclusion_reason:
    resources:
      - label: 출력 플러그인·스타일
        template_id: T23·T24
        availability: 일부
  - number: 19
    id: step19
    label: 최종 출력물 확인·승인
    type: ApprovalStep
    performed_by:
      - kind: human
        name: 작업자
    task: 페이지 넘김, 표 넘침, 이미지 위치, 경고 표시 등 레이아웃을 확인하고 납품 승인. 예외 승인된 잔여 오류가 있으면 납품 가능 여부를 함께 확인
    inputs:
      - HTML
      - PDF
      - 예외 승인 기록 (잔여 오류·허용 사유)
    outputs:
      - 승인된 최종 출력물
    sends_to_external_llm: false
    included: true
    requires_exclusion_reason: true
    exclusion_reason:
