loop:
  id: FixReverifyLoop
  label: 수정–재검증 반복
  body:
    - 11
    - 12
    - 13
    - 14
    - 15
    - 16
    - 17
  max_iterations: 3
  exit_on_pass_to: 16
  on_errors_remain_to: 16
  on_limit_reached: '3회째 재검증 후에도 오류가 남으면 자동 반복을 멈추고 16번에서 판단: 작업자 직접 수정 후 11번 재검증(자동 반복 횟수 미포함), 또는 예외 승인 후 최종 토픽 확정 → 18번'
  error_counting_rule: 16번에서 허용한 경고는 오류로 세지 않음
  pass_rule: 재검증 결과 오류 0건이어도 16번에서 최종 토픽을 확정한 뒤 18번으로 진행 (v2의 '오류 0건 → 18번 직행'과 '모든 결과는 16번으로 모음'의 불일치를 해소)
skip_rules:
  - id: skipAfterWellFormedFail
    label: 정형성 실패 파일 생략
    triggered_by_failure_of:
      - 11
    skips:
